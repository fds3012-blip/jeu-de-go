<!doctype html>

let W = '#F7E9DA';

// Pictogrammes dessinés sur une grille 100 × 100, zone utile 22–78.

const PALIER = { pomme: 0, caillou: 0, bambou: 0, renard: 1, riviere: 1, tigre: 1, montagne: 2, dragon: 2, sensei: 2, mochi: 3 };
const ENCRES = [['#D2432C', '#D2432C', '#F7E9DA'], ['#2F4B8A', '#2F4B8A', '#F7E9DA'], ['#1B1A18', '#1B1A18', '#E9B949'], ['#3CC48E', '#1E8A5F', '#F7E9DA']];
function sceau(nom, t, i) {
  const [col, c2, w] = ENCRES[PALIER[nom]]; C = c2; A = PALIER[nom] === 2 ? '#E9B949' : '#F7E9DA'; W = PALIER[nom] === 2 ? '#E9B949' : '#F7E9DA';
  const P = PF();
  const Wsave = W;
  return `<svg width="${t}" height="${t}" viewBox="0 0 100 100">
    <defs><filter id="enc${i}"><feTurbulence type="fractalNoise" baseFrequency="1.3" numOctaves="2" seed="${4 + i}"/><feDisplacementMap in="SourceGraphic" scale="3"/></filter></defs>
    <g filter="url(#enc${i})"><rect x="6" y="6" width="88" height="88" rx="22" fill="${col}" stroke="${PALIER[nom] === 2 ? '#E9B949' : 'none'}" stroke-width="3"/>

}
const L = [['pomme','Pomme','20 kyu'],['caillou','Caillou','16 kyu'],['bambou','Bambou','13 kyu'],['renard','Renard','10 kyu'],['riviere','Rivière','7 kyu'],['tigre','Tigre','5 kyu'],['montagne','Montagne','3 kyu'],['dragon','Dragon','1 kyu'],['sensei','Sensei','1 dan'],['mochi','Mochi','coach']];
document.getElementById('g').innerHTML = L.map(([k, n, r], i) => `<div class="c ${i > 3 && i < 9 ? '' : ''}">${sceau(k, 110, i)}<b>${n}</b><small>${r}</small></div>`).join('');
</script></body></html>

name: CI
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verifier:
    name: Lint, types, tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Budget de taille du JS initial, du CSS et des polices (scripts/budget-bundle.mjs).
      - run: npm run budget

  # Tests SQL (supabase/tests/*.test.sql) : toutes les migrations rejouées sur un Postgres jetable, puis chaque test.
  # Aucune connexion à la production. Le runner Ubuntu a déjà Postgres 16 ; sinon on l'installe par apt.
  sql:
    name: Migrations et tests SQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Postgres présent ?
        run: |
          if ! ls /usr/lib/postgresql/*/bin/initdb >/dev/null 2>&1; then
            sudo apt-get update -qq && sudo apt-get install -y -qq postgresql
          fi
          ls -d /usr/lib/postgresql/*/bin
      - run: bash supabase/tests/lancer.sh

  # La copie des règles du go (src/go → supabase/functions/game-action/go) doit être à jour sur chaque PR :
  # sinon le serveur déployé différerait du code testé. Même contrôle qu'avant le déploiement (deployer-fonctions.yml).
  fonctions:
    name: Copie src/go → supabase/functions à jour
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/sync-functions.mjs
      - name: Copie à jour
        run: |
          git diff --exit-code -- supabase/functions || { echo "::error::Copie périmée : lance npm run sync:functions et committe."; exit 1; }

  # Playwright en 4 lots parallèles (#467), lancés en même temps que « Lint, types, tests, build » (plus de `needs`) :
  # la CI passe de 15-20 min à moins de 8. Chaque lot construit l'app (webServer) et écrit un rapport « blob ».
  e2e-lots:
    name: Playwright, lot ${{ matrix.lot }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        lot: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      # Chromium en cache, clé = version de @playwright/test (le navigateur attendu change avec elle).
      - name: Version de Playwright
        id: pw
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        id: navigateurs
        with:
          path: ~/.cache/ms-playwright
          key: ms-playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.navigateurs.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      # Navigateur en cache : seules les bibliothèques système restent à installer.
      - if: steps.navigateurs.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx playwright test --shard=${{ matrix.lot }}/4
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blob-report-${{ matrix.lot }}
          path: blob-report/
          retention-days: 2
          if-no-files-found: ignore

  # Statut unique et lisible : ce job garde le nom « Playwright (mobile) » (scripts d'attente, protection de branche
  # éventuelle). Il fusionne les rapports des 4 lots (rapport HTML + annotations GitHub) et échoue si un lot échoue.
  e2e:
    name: Playwright (mobile)
    needs: e2e-lots
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - uses: actions/download-artifact@v4
        with:
          pattern: blob-report-*
          path: all-blob-reports
          merge-multiple: true
      - name: Rapport fusionné
        if: hashFiles('all-blob-reports/*.zip') != ''
        env:
          PLAYWRIGHT_HTML_OPEN: never
        run: npx playwright merge-reports --reporter=github,html ./all-blob-reports
      - uses: actions/upload-artifact@v4
        if: hashFiles('playwright-report/index.html') != ''
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
      - name: Tous les lots au vert
        if: needs.e2e-lots.result != 'success'
        run: |
          echo "::error::Au moins un lot Playwright a échoué ou a été annulé (résultat : ${{ needs.e2e-lots.result }})."
          exit 1

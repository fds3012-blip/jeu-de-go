    <script>
      // Liens courts partagés (#364, #285) : `/j/42`, `/defi#JETON`, `/partie#JETON` (et `/en/…`) ont leur propre page
      // d'aperçu (outils/apercus.ts) mais c'est la même app. Avant tout le reste (ouverture, jeton du défi, mesure),
      // l'adresse reprend sa forme habituelle : `/?go-du-jour=42`, `/#defi=JETON`, `/#partie=JETON`. Le jeton reste
      // dans le fragment : jamais envoyé au serveur. Pure : testée par src/app/partage.test.ts.
      function adresseCourte(chemin, recherche, fragment) {
        var m = /^\/(?:en(?:\/|$))?(?:(j)\/(\d{1,6})|(defi|partie))?\/?$/.exec(chemin);
        if (!m || chemin === '/') return null;
        var r = recherche || '';
        if (m[1]) return '/' + (r ? r + '&' : '?') + 'go-du-jour=' + m[2] + fragment;
        if (!m[3]) return '/' + r + fragment;
        var brut = fragment.replace(/^#/, '');
        if (!brut) return '/' + r;
        return '/' + r + '#' + (brut.indexOf(m[3] + '=') === 0 ? brut : m[3] + '=' + brut);
      }
      (function () {
        try {
          var a = adresseCourte(location.pathname, location.search, location.hash);
          if (a) history.replaceState(history.state, '', a);
        } catch (e) { /* adresse inchangée */ }
      })();
    </script>

    <title>Mochi Go : apprendre et jouer au go</title>
    <!--
      Ouverture animée (#406), dessinée ici, avant React : CSS et SVG en ligne, aucun JS de l'app.
      1. Première image : le logo deux pierres, en grand, comme l'écran de lancement natif (manifeste, images iOS).
      2. Les pierres rapetissent et se posent sur un goban sous la lampe ; le nom « Mochi Go » apparaît en haut.
      3. À 1 s pile (#406, demande de Florian : « une seconde en tout »), et seulement si l'accueil est monté, fondu ; l'action principale et la barre arrivent d'abord,
         puis le contenu, de haut en bas. Fini en 1,2 s environ ; un toucher la passe.
      Version courte (logo, fondu) si l'app a été ouverte il y a moins de 10 min ; simple fondu de 150 ms en mouvements
      réduits ; rien sur un lien de défi, un retour de connexion, un rechargement (dont « nouvelle version prête ») ni
      dans les tests (navigator.webdriver, sauf `e2e.ouverture` = « 1 »). Tests : src/ouverture.test.ts, e2e/ouverture.spec.ts.
    -->
    <style>
      :root { --ouv-fond: #1C1916; --ouv-encre: #F3EDE3; --ouv-lune: .22; }
      @media (prefers-color-scheme: light) { :root:not([data-theme="dark"]) { --ouv-fond: #EFE8DC; --ouv-encre: #1C1916; --ouv-lune: 0; } }
      :root[data-theme="light"] { --ouv-fond: #EFE8DC; --ouv-encre: #1C1916; --ouv-lune: 0; }
      #ouverture { display: none; position: fixed; inset: 0; z-index: 2147483000; overflow: hidden; contain: strict;
        background: var(--halo, none) no-repeat, var(--ouv-fond); -webkit-tap-highlight-color: transparent; user-select: none;
        transition: opacity 220ms var(--ease, cubic-bezier(.2, .8, .2, 1)), transform 280ms var(--ease, cubic-bezier(.2, .8, .2, 1)); }
      html[data-ouverture] #ouverture { display: block; }
      #ouverture > * { position: absolute; pointer-events: none; }
      /* Couleur de l'écran natif (Android : fond du manifeste ; iOS : image claire ou sombre), qui s'efface vers le thème. */
      .ouv-debut { display: none; inset: 0; background: #1C1916; }
      [data-ouverture-debut="clair"] .ouv-debut { background: #EFE8DC; }
      [data-ouverture-debut] .ouv-debut { display: block; }
      .ouv-logo { left: 50%; top: 50%; width: 240px; height: 240px; margin: -120px 0 0 -120px; }
      .ouv-logo .lune { stroke: #F3EDE3; stroke-opacity: var(--ouv-lune); }
      .ouv-logo .detache { fill: var(--ouv-fond); }
      .ouv-logo .detache-debut { display: none; fill: #1C1916; }
      [data-ouverture-debut="clair"] .ouv-logo .detache-debut { fill: #EFE8DC; }
      [data-ouverture-debut] .ouv-logo .detache-debut { display: inline; }
      /* Android : l'écran natif de Chrome montre l'icône à 112 dp environ ; la première image part de cette taille. */
      [data-ouverture-debut="android"] .ouv-logo { transform: scale(.47); }
      /* La scène : seulement dans la version entière. */
      .ouv-nom, .ouv-sol, .ouv-ombre { display: none; }
      [data-ouverture="plein"] :is(.ouv-nom, .ouv-sol, .ouv-ombre) { display: block; }
      .ouv-nom { left: 50%; top: max(16vh, calc(56px + env(safe-area-inset-top, 0px))); width: 256px; height: 45px; margin-left: -128px; fill: var(--ouv-encre); }
      /* Point de pose des pierres : 12vh sous le centre. Le goban est centré un peu derrière, sous la lampe. */
      .ouv-sol { left: 50%; top: calc(50% + 12vh - 36px); width: 0; height: 0; }
      .ouv-plan { position: absolute; left: -220px; top: -220px; width: 440px; height: 440px; transform: perspective(900px) rotateX(60deg);
        -webkit-mask-image: radial-gradient(closest-side, #000 22%, rgba(0, 0, 0, .55) 55%, transparent 82%);
        mask-image: radial-gradient(closest-side, #000 22%, rgba(0, 0, 0, .55) 55%, transparent 82%); }
      .ouv-ombre { left: 50%; top: calc(50% + 12vh); width: 150px; height: 30px; margin: -19px 0 0 -75px;
        background: radial-gradient(closest-side, rgba(24, 14, 4, .55), rgba(24, 14, 4, 0)); }
      [data-ouverture="plein"] .ouv-logo { animation: ouv-pose 550ms 150ms cubic-bezier(.77, 0, .175, 1) both; }
      [data-ouverture="plein"] .ouv-sol { animation: ouv-sol 500ms 220ms var(--ease, cubic-bezier(.2, .8, .2, 1)) both; }
      [data-ouverture="plein"] .ouv-ombre { animation: ouv-apparait 200ms 560ms ease-out both; }
      [data-ouverture="plein"] .ouv-nom { animation: ouv-monte 360ms 420ms var(--ease, cubic-bezier(.2, .8, .2, 1)) both; }
      :is([data-ouverture="plein"], [data-ouverture="court"]) :is(.ouv-debut, .detache-debut) { animation: ouv-efface 400ms 80ms ease-out both; }
      @keyframes ouv-pose { to { transform: translateY(calc(12vh - 41px)) scale(.64); } }
      @keyframes ouv-sol { from { opacity: 0; transform: translateY(40px) scale(.94); } }
      @keyframes ouv-monte { from { opacity: 0; transform: translateY(10px); } }
      @keyframes ouv-apparait { from { opacity: 0; } }
      @keyframes ouv-efface { to { opacity: 0; } }
      /* Fin : fondu (et léger recul de la scène dans la version entière). Un toucher accélère le fondu. */
      html.ouv-fin #ouverture { opacity: 0; pointer-events: none; }
      html[data-ouverture="plein"].ouv-fin #ouverture { transform: scale(1.03); }
      html[data-ouverture="reduit"] #ouverture { transition: opacity 150ms ease-out; }
      html.ouv-saute #ouverture { transition-duration: 120ms; }
      /* Le toucher qui passe l'ouverture ne doit rien toucher dessous : elle le garde jusqu'à son « clic ». */
      html.ouv-tenu #ouverture { pointer-events: auto; }
      /* L'accueil se construit : l'action principale et la barre d'abord, puis le contenu de haut en bas. */
      html[data-ouverture="plein"].ouv-fin :is(.nav, .cta) { animation: ouv-arrive 280ms var(--ease, cubic-bezier(.2, .8, .2, 1)) both; }
      html[data-ouverture="plein"].ouv-fin :is(.app > :not(.accueil), .accueil > :not(.cta)) { animation: ouv-contenu 240ms 60ms var(--ease, cubic-bezier(.2, .8, .2, 1)) both; }
      html[data-ouverture="plein"].ouv-fin .accueil > :nth-child(2):not(.cta) { animation-delay: 90ms; }
      html[data-ouverture="plein"].ouv-fin .accueil > :nth-child(3):not(.cta) { animation-delay: 120ms; }
      html[data-ouverture="plein"].ouv-fin .accueil > :nth-child(4):not(.cta) { animation-delay: 150ms; }
      html[data-ouverture="plein"].ouv-fin .accueil > :nth-child(n + 5):not(.cta) { animation-delay: 180ms; }
      @keyframes ouv-arrive { from { opacity: 0; translate: 0 16px; } }
      @keyframes ouv-contenu { from { opacity: 0; translate: 0 6px; } }
    </style>
    <script>
      // Décide de l'ouverture (#406) : 'plein', 'court', 'reduit' ou null (aucune). Pure : testée par src/ouverture.test.ts.
      function modeOuverture(c) {
        if (c.forcer === '0' || (c.webdriver && c.forcer !== '1') || c.cachee) return null;
        // Lien de défi ou de partie partagée (#364), retour de connexion (lien magique, Google) : l'écran attendu tout de suite.
        if (/^#(?:defi|partie)=/.test(c.adresse) || /(?:^|[#&?])(?:access_token|refresh_token|error_description|error_code|token_hash|code)=/.test(c.adresse)) return null;
        // Rechargement (nouvelle version prête, langue, erreur), retour arrière, ou déjà vue dans cet onglet.
        if (c.navigation === 'reload' || c.navigation === 'back_forward' || c.dejaVue) return null;
        if (c.reduit) return 'reduit';
        return c.maintenant - c.derniere < 600000 ? 'court' : 'plein';
      }
      (function () {
        var h = document.documentElement;
        var mm = function (q) { return !!(window.matchMedia && matchMedia(q).matches); };
        var stock = function (nom) { try { return window[nom]; } catch (e) { return null; } };
        var ls = stock('localStorage'), ss = stock('sessionStorage');
        var lire = function (s, k) { try { return s ? s.getItem(k) : null; } catch (e) { return null; } };
        var ecrire = function (s, k, v) { try { if (s) s.setItem(k, v); } catch (e) { /* stockage indisponible */ } };
        // Thème choisi dans le Profil, posé avant le premier rendu (src/app/settings.ts fait de même ensuite).
        try { var th = JSON.parse(lire(ls, 'go.settings.v1') || '{}').theme; if (th === 'dark' || th === 'light') h.setAttribute('data-theme', th); } catch (e) { /* réglage illisible */ }
        var nav = performance.getEntriesByType ? performance.getEntriesByType('navigation')[0] : null;
        var maintenant = Date.now();
        var mode = modeOuverture({
          webdriver: navigator.webdriver === true, forcer: lire(ls, 'e2e.ouverture'), cachee: document.visibilityState === 'hidden',
          adresse: location.hash + location.search, navigation: nav ? nav.type : null, dejaVue: lire(ss, 'go.ouverture.vue') === '1',
          reduit: mm('(prefers-reduced-motion: reduce)'), derniere: Number(lire(ls, 'go.ouverture.derniere')) || 0, maintenant: maintenant,
        });
        ecrire(ss, 'go.ouverture.vue', '1');
        ecrire(ls, 'go.ouverture.derniere', String(maintenant));
        if (!mode) return;
        h.setAttribute('data-ouverture', mode);
        // App installée : l'écran natif précède la page. iOS montre l'image de lancement claire ou sombre selon
        // l'appareil ; Android (Chrome) peint le fond du manifeste (sombre) avec l'icône en petit.
        var ios = navigator.standalone === true;
        if (ios) h.setAttribute('data-ouverture-debut', mm('(prefers-color-scheme: dark)') ? 'sombre' : 'clair');
        else if (mm('(display-mode: standalone)')) h.setAttribute('data-ouverture-debut', 'android');
      })();
    </script>

    <script>
      // Fin de l'ouverture (#406) : quand l'accueil est monté dans #root, et pas avant 1 s depuis la première image
      // (version entière : la scène se pose en 0,8 s puis reste, calme) ; un toucher n'attend plus.
      // Filet : 4 s au plus, quoi qu'il arrive.
      (function () {
        var h = document.documentElement, el = document.getElementById('ouverture'), mode = h.getAttribute('data-ouverture');
        if (!mode) { el.remove(); return; }
        var duree = mode === 'plein' ? 1000 : mode === 'court' ? 260 : 0;
        var debut = performance.now(), monte = false, saute = false, fini = false, attente = 0;
        requestAnimationFrame(function () { debut = performance.now(); });
        function finir() {
          if (fini) return;
          fini = true;
          h.classList.add('ouv-fin');
          // L'ouverture part dès la fin de son fondu (220 ms) ; l'accueil finit de se construire ensuite.
          setTimeout(function () { el.remove(); }, 240);
          setTimeout(function () {
            h.classList.remove('ouv-fin', 'ouv-saute', 'ouv-tenu');
            h.removeAttribute('data-ouverture');
            h.removeAttribute('data-ouverture-debut');
          }, mode === 'plein' ? 520 : 240);
        }
        function essayer() {
          if (!monte || fini) return;
          var reste = saute ? 0 : duree - (performance.now() - debut);
          clearTimeout(attente);
          if (reste <= 0) finir(); else attente = setTimeout(finir, reste);
        }
        var root = document.getElementById('root');
        var mo = new MutationObserver(function () { if (root.firstElementChild) { mo.disconnect(); monte = true; essayer(); } });
        mo.observe(root, { childList: true });
        var lacher = function () { h.classList.remove('ouv-tenu'); };
        el.addEventListener('pointerdown', function () {
          saute = true;
          h.classList.add('ouv-saute', 'ouv-tenu');
          setTimeout(lacher, 500); // glissé sans clic : on rend la main quand même
          essayer();
        });
        el.addEventListener('click', function (e) { e.preventDefault(); e.stopPropagation(); setTimeout(lacher, 0); }, true);
        setTimeout(function () { monte = true; saute = true; essayer(); }, 4000);
      })();
    </script>
